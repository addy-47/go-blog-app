steps:
  # Step 1: Retrieve SSH private key from Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=go-blog-app-ssh-private-key > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        ssh-keyscan github.com >> /root/.ssh/known_hosts

  # Step 2: Detect changed services (using git diff)
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git fetch origin
        CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
        SERVICES=""
        for service in backend database; do
          if echo "$CHANGED_FILES" | grep -q "^$service/"; then
            SERVICES="$SERVICES $service"
          fi
        done
        echo "Changed services: $SERVICES" > /workspace/changed_services.txt

  # Step 3: Build and push Docker images for changed services
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        export DOCKER_BUILDKIT=1
        while read -r service; do
          if [ -n "$service" ]; then
            docker build -t us-central1-docker.pkg.dev/${PROJECT_ID}/go-blog-app/$service:${COMMIT_SHA} ./$service
            docker push us-central1-docker.pkg.dev/${PROJECT_ID}/go-blog-app/$service:${COMMIT_SHA}
          fi
        done < /workspace/changed_services.txt

  # Step 4: Update docker-compose.yml with new image tags
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        while read -r service; do
          if [ -n "$service" ]; then
            sed -i "s|us-central1-docker.pkg.dev/${PROJECT_ID}/go-blog-app/$service:.*|us-central1-docker.pkg.dev/${PROJECT_ID}/go-blog-app/$service:${COMMIT_SHA}|g" docker-compose.yml
          fi
        done < /workspace/changed_services.txt
        git config --global user.email "cloudbuild@google.com"
        git config --global user.name "Cloud Build"
        git add docker-compose.yml
        git commit -m "Update docker-compose.yml with new image tags [skip ci]"
        git push origin main

  # Step 5: SSH to VM, pull latest code, and run docker-compose up
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa deploy-user@${_VM_IP} << 'EOF'
          cd /app
          git pull origin main
          docker-compose down
          docker-compose up -d
        EOF
substitutions:
  _VM_IP: ${module.vm.vm_ip}
options:
  logging: CLOUD_LOGGING_ONLY