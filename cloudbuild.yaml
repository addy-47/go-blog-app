steps:
  # Step 1: Detect missing and changed services
  - name: 'gcr.io/cloud-builders/gcloud'
    id: detect-changes
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # A. Find services MISSING on the VM
        echo "Checking running services on VM..."
        running_images=$(gcloud compute ssh --zone ${_ZONE} ${_VM_NAME} --command "docker ps --format '{{.Image}}'" || echo "")
        missing_services=""
        for service in ${_ALL_SERVICES}; do
          if ! echo "$running_images" | grep -q "/$service:"; then
            missing_services="$missing_services $service"
          fi
        done
        echo "Missing services on VM: $missing_services"
        # B. Find services that CHANGED in the git commit
        echo "Checking changed services..."
        # Fetch the branch used by the trigger
        git fetch origin $BRANCH_NAME
        changed_files=$(git diff --name-only HEAD^ HEAD || git ls-tree -r HEAD --name-only)
        changed_services=""
        for service in ${_ALL_SERVICES}; do
          if echo "$changed_files" | grep -q "^$service/"; then
            changed_services="$changed_services $service"
          fi
        done
        echo "Changed services in commit: $changed_services"
        # C. Combine lists and save
        services_to_build=$(echo "$missing_services $changed_services" | tr ' ' '\n' | sort -u | tr '\n' ' ')
        echo "Final list of services to build: $services_to_build"
        echo "$services_to_build" > /workspace/services_to_build.txt

  # Step 2: Authenticate with Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: auth-docker
    entrypoint: 'bash'
    args:
      - '-c'
      - 'gcloud auth configure-docker ${_GAR_REGION}-docker.pkg.dev'

  # Step 3: Build and push Docker images
  - name: 'gcr.io/cloud-builders/docker'
    id: build-and-push
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        services=$(cat /workspace/services_to_build.txt)
        if [ -z "$services" ]; then
          echo "No services to build. Skipping."
          exit 0
        fi
        for service in $services; do
          echo "Building and pushing $service..."
          docker build -t ${_GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO_NAME}/$service:${COMMIT_SHA} ./$service
          docker push ${_GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO_NAME}/$service:${COMMIT_SHA}
        done

  # Step 4: Update and deploy to VM
  - name: 'gcr.io/cloud-builders/gcloud'
    id: deploy-to-vm
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        services=$(cat /workspace/services_to_build.txt)
        if [ -z "$services" ]; then
          echo "No services to update. Skipping."
          exit 0
        fi
        # Set environment variables for substitution
        export GAR_REGISTRY=${_GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO_NAME}
        export TAG_NAME=${COMMIT_SHA}
        # Substitute variables in docker-compose.yml
        envsubst < docker-compose.yml > docker-compose.rendered.yml
        # Ensure deployment directory exists on VM
        gcloud compute ssh --zone ${_ZONE} ${_VM_NAME} --command "mkdir -p /var/www/go-blog-app"
        # Copy docker-compose file to VM
        gcloud compute scp --zone ${_ZONE} docker-compose.rendered.yml ${_VM_NAME}:/var/www/go-blog-app/docker-compose.yml
        # Deploy on VM
        gcloud compute ssh --zone ${_ZONE} ${_VM_NAME} --command "cd /var/www/go-blog-app && docker-compose pull && docker-compose up -d --remove-orphans"

substitutions:
  _PROJECT_ID: 'go-blog-app-1'
  _VM_NAME: "blog-vm"
  _ZONE: "us-central1-a"
  _GAR_REGION: "us-central1"
  _GAR_REPO_NAME: "blog-app"
  _ALL_SERVICES: "backend frontend worker logging-agent"

options:
  logging: CLOUD_LOGGING_ONLY
