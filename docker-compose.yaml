version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
  logging-agent:
    build: ./logging-agent
  worker:
    build: ./worker
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=blog
    ports:
      - "5432:5432"
