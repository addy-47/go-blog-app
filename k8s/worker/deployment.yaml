apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ci-cd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: app-workload-sa
      containers:
      - name: worker
        image: image-placeholder:latest # This will be replaced by the CI/CD pipeline
        livenessProbe:
          exec:
            # This command runs the compiled binary inside the container with the "healthcheck" argument.
            # If it exits with a non-zero code, Kubernetes will restart the container.
            command:
            - /worker # Assumes the binary is named 'worker' in the container's root
            - healthcheck
          initialDelaySeconds: 30 # Give the worker time to start and connect to the DB
          periodSeconds: 30
          timeoutSeconds: 5
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
