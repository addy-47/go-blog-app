apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: ci-cd
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["db-secret"]  # Restrict access to db-secret only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-secret-reader
  namespace: ci-cd
subjects:
- kind: ServiceAccount
  name: app-workload-sa # Use the new KSA that is linked to a GCP identity
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
