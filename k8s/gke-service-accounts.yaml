# This file defines the Kubernetes Service Accounts (KSAs) that are linked to
# Google Service Accounts (GSAs) via Workload Identity.

# This KSA is for the application workloads (backend, frontend, etc.).
# The annotation links it to the GCP Service Account 'app-workload-sa'.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-workload-sa # This name MUST match the one in the Terraform IAM binding
  namespace: ci-cd
  annotations:
    # This annotation tells GKE to associate this KSA with the specified GSA.
    iam.gke.io/gcp-service-account: app-workload-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
---
# This KSA is for the database workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-sa # This name MUST match the one in the Terraform IAM binding
  namespace: ci-cd
  annotations:
    iam.gke.io/gcp-service-account: database-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com