# a ci-cd workflow for building and deploying services in a GKE cluster using Google Artifact Registry.
# This workflow call scripts to build Docker images for each service, pushes them to Google Artifact Registry,
# and deploys them to a GKE cluster. It also handles changes in the codebase
# by checking which services have changed and only processing those.

name: Build and Deploy Services

on:
  push:
    branches:
      - ci-cd 

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_REPOSITORY: blog-app
  GKE_CLUSTER: blog-app-cluster
  GKE_REGION: us-central1
  NAMESPACE: ci-cd
  K8S_DIR: k8s
  SCRIPTS_DIR: scripts
  SERVICES: |
    frontend:frontend
    backend:backend
    worker:worker
    logging-agent:logging-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Make scripts executable
        run: chmod +x ${{ env.SCRIPTS_DIR }}/*.sh

      - name: Identify services to process
        id: services_to_process
        run: |
          ${{ env.SCRIPTS_DIR }}/identify-services.sh \
            "${{ env.SERVICES }}" \
            "${{ env.NAMESPACE }}" \
            "${{ github.event.before }}" \
            "${{ github.sha }}"

      - name: Configure Docker for Artifact Registry
        if: steps.services_to_process.outputs.services != ''
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Images
        if: steps.services_to_process.outputs.services != ''
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          REGISTRY_PATH=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}
          
          ${{ env.SCRIPTS_DIR }}/build-and-push.sh \
            "${{ env.SERVICES }}" \
            "${{ steps.services_to_process.outputs.services }}" \
            "$IMAGE_TAG" \
            "$REGISTRY_PATH"

      - name: Deploy to GKE
        if: steps.services_to_process.outputs.services != ''
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          REGISTRY_PATH=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}
          
          ${{ env.SCRIPTS_DIR }}/deploy-to-gke.sh \
            "${{ env.SERVICES }}" \
            "${{ steps.services_to_process.outputs.services }}" \
            "$IMAGE_TAG" \
            "$REGISTRY_PATH" \
            "${{ env.NAMESPACE }}" \
            "${{ env.K8S_DIR }}"

      - name: Notify on Success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Services processed: ${{ steps.services_to_process.outputs.services }}"
          echo "Image tag: $(echo ${{ github.sha }} | cut -c1-7)"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details."